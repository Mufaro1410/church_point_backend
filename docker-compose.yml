# A THROWAWAY Postgres for the database tests. Never point tests at your real Supabase project.
#   docker compose up -d testdb
#   TEST_DATABASE_URL=postgres://postgres:postgres@localhost:55432/postgres cargo test
services:
  testdb:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"
    command: ["postgres", "-c", "fsync=off", "-c", "max_connections=200"]
